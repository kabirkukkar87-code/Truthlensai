[build]
  publish = "."
  functions = "netlify/functions"

# Dedicated internal rewrites with force = true (HTTP 200)
[[redirects]]
  from = "/api/verify"
  to = "/.netlify/functions/verify"
  status = 200
  force = true

[[redirects]]
  from = "/api/health"
  to = "/.netlify/functions/health"
  status = 200
  force = true

[[redirects]]
  from = "/api/translate"
  to = "/.netlify/functions/translate"
  status = 200
  force = true

# Wildcard catch-all for any additional API calls
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200
  force = true
